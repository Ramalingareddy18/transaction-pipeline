name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transaction_pipeline_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        DB_HOST=localhost
        DB_PORT=5432
        DB_NAME=transaction_pipeline_db
        DB_USER=postgres
        DB_PASSWORD=postgres
        EOF
    
    - name: Run linting
      run: |
        pip install flake8 black isort
        black --check .
        isort --check .
        flake8 . --max-line-length=100 --exclude=venv,.venv
    
    - name: Run unit tests
      run: python -m pytest tests/ -v --tb=short
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: transaction_pipeline_db
        DB_USER: postgres
        DB_PASSWORD: postgres
    
    - name: Test database connection
      run: python src/database_connection.py
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: transaction_pipeline_db
        DB_USER: postgres
        DB_PASSWORD: postgres
    
    - name: Run ETL pipeline test
      run: python src/etl_pipeline.py
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: transaction_pipeline_db
        DB_USER: postgres
        DB_PASSWORD: postgres

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: transaction-api:latest
    
    - name: Test Docker compose
      run: |
        docker-compose build
        docker-compose up -d
        sleep 20
        docker-compose ps
        docker-compose down

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security check
      run: bandit -r . -ll || true
    
    - name: Check for vulnerable dependencies
      run: safety check || true

  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pylint coverage
    
    - name: Run pylint
      run: pylint src/ app/ --disable=all --enable=E,F || true
    
    - name: Generate coverage report
      run: |
        pip install pytest-cov
        pytest tests/ --cov=src --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
